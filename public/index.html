<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Calendar</title>
<style>
  :root {
    --ink: #111111;
    --paper: #F5F3EE;
    --card: #FFFFFF;
    --accent: #2453FF;
    --accent-ink: #FFFFFF;
    --line: #111111;
    --muted: #6B6B63;
    --today: #FFD23F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .layout-grid {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }

  .main-col {
    flex: 1;
    min-width: 0;
  }

  .sidebar {
    width: 300px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 900px) {
    .layout-grid { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    border-bottom: 4px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 8px 12px;
    box-shadow: 3px 3px 0 var(--line);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ECC71;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  .pulse-dot.stale { background: #E74C3C; animation: none; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
    70% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }

  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .calendar-nav-title {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .calendar-nav-buttons { display: flex; gap: 8px; }

  .nav-btn {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 6px 14px;
    cursor: pointer;
  }

  .nav-btn:hover { background: var(--accent); color: var(--accent-ink); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border: 2.5px solid var(--line);
    background: var(--line);
    gap: 2px;
  }

  .weekday-header {
    background: var(--ink);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
    padding: 6px 0;
  }

  .day-cell {
    background: var(--card);
    min-height: 96px;
    min-width: 0;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }

  .day-cell.outside-month { background: #ECE9E1; }
  .day-cell.is-today { background: #FFF6D9; }

  .day-number {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
    color: var(--muted);
    align-self: flex-end;
  }

  .day-cell.is-today .day-number {
    background: var(--today);
    border: 2px solid var(--line);
    color: var(--ink);
    padding: 0 6px;
  }

  .day-chip {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    font-size: 10.5px;
    line-height: 1.25;
    background: var(--ink);
    color: var(--accent-ink);
    padding: 2px 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: default;
  }

  .day-chip-more {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
  }

  @media (max-width: 640px) {
    .day-cell { min-height: 64px; padding: 4px; }
    .weekday-header { font-size: 9px; }
    .day-chip { font-size: 9px; }
  }

  .day-popover {
    position: fixed;
    z-index: 10;
    max-width: 280px;
    background: var(--card);
    border: 2.5px solid var(--line);
    box-shadow: 5px 5px 0 var(--line);
    padding: 12px 14px;
  }

  .day-popover-title {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .day-popover-item { margin-bottom: 8px; }
  .day-popover-item:last-child { margin-bottom: 0; }

  .day-popover-time {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
  }

  .day-popover-close {
    position: absolute;
    top: 6px;
    right: 8px;
    cursor: pointer;
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }

  .client-tag {
    display: inline-block;
    background: var(--ink);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    margin-right: 6px;
  }

  .meeting-type-tag {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
  }

  .am-tag {
    display: inline-block;
    background: #7C3AED;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    margin-left: 6px;
    text-decoration: none;
    cursor: default;
  }

  a.am-tag { cursor: pointer; }
  a.am-tag:hover { background: #5B21B6; }
  }

  .upcoming-type {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .filter-chip {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 6px 12px;
    cursor: pointer;
    user-select: none;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .filter-chip.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .filter-bar-am .filter-chip.active {
    background: #7C3AED;
    color: #FFFFFF;
    border-color: #7C3AED;
  }

  .empty-state, .error-state {
    border: 2.5px dashed var(--line);
    padding: 40px 20px;
    text-align: center;
    font-family: 'Courier New', monospace;
    color: var(--muted);
  }

  .error-state { border-color: #E74C3C; color: #E74C3C; }

  footer {
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 40px;
  }

  .upcoming-section {
    margin-top: 40px;
    border-top: 4px solid var(--line);
    padding-top: 22px;
  }

  .upcoming-hint {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    margin: -6px 0 14px;
  }

  .upcoming-row[draggable="true"] {
    cursor: grab;
  }

  .upcoming-row.dragging {
    opacity: 0.4;
  }

  .claimant-tag {
    display: inline-block;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    flex-shrink: 0;
    border: 2px solid var(--line);
  }

  .team-group {
    margin-bottom: 18px;
  }

  .team-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 2px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 8px;
  }

  .person-lane {
    margin-bottom: 10px;
  }

  .person-lane-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .person-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
  }

  .person-lane-drop {
    min-height: 46px;
    border: 2px dashed var(--line);
    padding: 6px;
    transition: background 0.15s, border-color 0.15s;
  }

  .person-lane-drop.drag-over {
    background: #EAF1FF;
    border-color: var(--accent);
    border-style: solid;
  }

  .person-lane-empty {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    color: var(--muted);
    padding: 6px 4px;
  }

  .claim-card {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 var(--line);
    padding: 6px 8px;
    margin-bottom: 6px;
  }

  .claim-card-title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .claim-release-btn {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 3px 7px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .claim-release-btn:hover {
    background: #E74C3C;
    color: #FFFFFF;
    border-color: #E74C3C;
  }

  .upcoming-heading {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }

  .upcoming-row {
    display: grid;
    grid-template-columns: 120px 130px 1fr;
    gap: 14px;
    align-items: center;
    padding: 12px 16px;
    background: var(--card);
    border: 2px solid var(--line);
    border-left: 8px solid var(--muted);
    margin-bottom: 8px;
  }

  .upcoming-row.urgency-today {
    border-left-color: #E74C3C;
    background: #FDECEA;
  }

  .upcoming-row.urgency-tomorrow {
    border-left-color: #FF8C42;
    background: #FFF3E8;
  }

  .upcoming-row.urgency-week {
    border-left-color: #F2B705;
    background: #FFFAEA;
  }

  .upcoming-row.urgency-later {
    border-left-color: var(--accent);
    background: var(--card);
  }

  .upcoming-row:nth-child(1) { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }

  .upcoming-date {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .upcoming-time {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 17px;
  }

  .upcoming-info {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .upcoming-client {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--accent-ink);
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .upcoming-title {
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @media (max-width: 520px) {
    .upcoming-row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Calendar</h1>
    <div class="sync-status" id="syncStatus">
      <span class="pulse-dot" id="pulseDot"></span>
      <span id="syncText">Connecting…</span>
    </div>
  </header>

  <div class="layout-grid">
    <div class="main-col">
      <div class="filter-bar" id="filterBar"></div>
      <div class="filter-bar filter-bar-am" id="amFilterBar"></div>

      <div class="calendar-nav">
        <div class="calendar-nav-title" id="calendarNavTitle"></div>
        <div class="calendar-nav-buttons">
          <div class="nav-btn" id="prevMonthBtn">‹ Prev</div>
          <div class="nav-btn" id="todayBtn">Today</div>
          <div class="nav-btn" id="nextMonthBtn">Next ›</div>
        </div>
      </div>

      <div id="content">
        <div class="empty-state">Loading events…</div>
      </div>

      <section class="upcoming-section">
        <h2 class="upcoming-heading">Coming Up</h2>
        <p class="upcoming-hint">Drag an item onto a name in "In Process" to claim it.</p>
        <div id="upcomingList"></div>
      </section>
    </div>

    <aside class="sidebar" id="inProcessSidebar">
      <h2 class="upcoming-heading">In Process</h2>
      <div id="inProcessTeams"></div>
    </aside>
  </div>

  <footer>Auto-refreshes every 5 minutes · Source: shared team Google Calendar</footer>
</div>

<script>
  // Paste your Apps Script Web App deployment URL here.
  const FEED_URL = 'https://script.google.com/macros/s/AKfycbyJF1HHon9mOqlALIUQAYAiQsLpEqWLydUpt0wNk4MQEDi2NqQ6tPUP52hZHYUWaAht/exec';
  const REFRESH_MS = 5 * 60 * 1000; // 5 minutes

  const contentEl = document.getElementById('content');
  const syncTextEl = document.getElementById('syncText');
  const pulseDotEl = document.getElementById('pulseDot');
  const filterBarEl = document.getElementById('filterBar');
  const amFilterBarEl = document.getElementById('amFilterBar');

  let allEvents = [];
  let activeClient = 'All';
  let activeAM = 'All';
  let viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

  const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function formatTime(dateStr, allDay) {
    if (allDay) return 'All day';
    const d = new Date(dateStr);
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function groupByDateKey(events) {
    const map = new Map();
    events.forEach(ev => {
      const key = new Date(ev.start).toDateString();
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(ev);
    });
    return map;
  }

  function getFilteredEvents() {
    return allEvents
      .filter(ev => activeClient === 'All' || ev.client === activeClient)
      .filter(ev => activeAM === 'All' || ev.am === activeAM);
  }

  function renderFilterBar() {
    const clients = ['All', ...new Set(allEvents.map(ev => ev.client))].sort((a, b) => a === 'All' ? -1 : a.localeCompare(b));
    filterBarEl.innerHTML = clients.map(c =>
      `<div class="filter-chip${c === activeClient ? ' active' : ''}" data-client="${escapeHtml(c)}" title="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join('');

    filterBarEl.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeClient = chip.dataset.client;
        renderFilterBar();
        renderCalendarGrid();
      });
    });
  }

  function renderAMFilterBar() {
    const ams = ['All', ...new Set(allEvents.map(ev => ev.am))].sort((a, b) => a === 'All' ? -1 : a.localeCompare(b));
    amFilterBarEl.innerHTML = ams.map(a =>
      `<div class="filter-chip${a === activeAM ? ' active' : ''}" data-am="${escapeHtml(a)}" title="AM: ${escapeHtml(a)}">${escapeHtml(a)}</div>`
    ).join('');

    amFilterBarEl.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeAM = chip.dataset.am;
        renderAMFilterBar();
        renderCalendarGrid();
      });
    });
  }

  function renderUpcoming(events) {
    const upcomingEl = document.getElementById('upcomingList');
    const now = new Date();

    const upcoming = events
      .filter(ev => new Date(ev.end) >= now)
      .sort((a, b) => new Date(a.start) - new Date(b.start))
      .slice(0, 8);

    if (!upcoming.length) {
      upcomingEl.innerHTML = '<div class="empty-state">Nothing upcoming.</div>';
      return;
    }

    upcomingEl.innerHTML = upcoming.map(ev => {
      const d = new Date(ev.start);
      const dateStr = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      const daysUntil = Math.floor((new Date(d.toDateString()) - new Date(now.toDateString())) / 86400000);
      let urgencyClass = 'urgency-later';
      if (daysUntil <= 0) urgencyClass = 'urgency-today';
      else if (daysUntil === 1) urgencyClass = 'urgency-tomorrow';
      else if (daysUntil <= 7) urgencyClass = 'urgency-week';

      const claimants = ev.claimants || [];
      const claimedClass = claimants.length ? ' claimed' : '';
      const claimedBadge = claimants
        .map(c => `<span class="claimant-tag" style="background:${personColor(c.claimedBy)};" title="Claimed by ${escapeHtml(c.claimedBy)}">${escapeHtml(c.claimedBy)}</span>`)
        .join('');

      return `
        <div class="upcoming-row ${urgencyClass}${claimedClass}" draggable="true" data-key="${escapeHtml(ev.key)}">
          <div class="upcoming-date">${dateStr}</div>
          <div class="upcoming-time">${formatTime(ev.start, ev.allDay)}</div>
          <div class="upcoming-info">
            <span class="upcoming-client">${escapeHtml(ev.client)}</span>
            <span class="upcoming-type">${escapeHtml(ev.meetingType)}</span>
            ${amTagHtml(ev, 'margin-left:0;')}
            <span class="upcoming-title">${escapeHtml(ev.title)}</span>
            ${claimedBadge}
          </div>
        </div>
      `;
    }).join('');

    upcomingEl.querySelectorAll('.upcoming-row[draggable="true"]').forEach(row => {
      row.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', row.dataset.key);
        e.dataTransfer.effectAllowed = 'move';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
    });
  }

  const TEAM_ROSTER = {
    'SEO & Content': ['Michael Falco', 'Stacey Berlin', 'Emily Butman'],
    'Paid Advertisement': ['Heather Brousell', 'Stephan Simmons'],
  };

  // One fixed color per person — same color everywhere they show up
  // (Coming Up badges, sidebar lane headers, claim cards).
  const PERSON_COLORS = {
    'Michael Falco': '#2453FF',
    'Stacey Berlin': '#0F9D58',
    'Emily Butman': '#E67E22',
    'Heather Brousell': '#7C3AED',
    'Stephan Simmons': '#E74C3C',
  };
  function personColor(name) {
    return PERSON_COLORS[name] || '#6B6B63'; // muted gray fallback for anyone not in the map
  }

  function renderInProcessBoard() {
    const teamsEl = document.getElementById('inProcessTeams');
    const claimedByName = {};
    allEvents.forEach(ev => {
      (ev.claimants || []).forEach(c => {
        if (!claimedByName[c.claimedBy]) claimedByName[c.claimedBy] = [];
        claimedByName[c.claimedBy].push({ ev, claimedAt: c.claimedAt });
      });
    });

    teamsEl.innerHTML = Object.entries(TEAM_ROSTER).map(([team, people]) => `
      <div class="team-group">
        <div class="team-label">${escapeHtml(team)}</div>
        ${people.map(person => {
          const items = (claimedByName[person] || []).sort((a, b) => new Date(a.claimedAt) - new Date(b.claimedAt));
          const cards = items.length
            ? items.map(({ ev }) => `
                <div class="claim-card" data-key="${escapeHtml(ev.key)}" style="border-left: 5px solid ${personColor(person)};">
                  <span class="claim-card-title" title="${escapeHtml(ev.client + ' — ' + ev.meetingType + ': ' + ev.title)}">${escapeHtml(ev.client)}: ${escapeHtml(ev.title)}</span>
                  <div class="claim-release-btn" data-key="${escapeHtml(ev.key)}" data-person="${escapeHtml(person)}">✕</div>
                </div>
              `).join('')
            : '<div class="person-lane-empty">Nothing claimed</div>';
          return `
            <div class="person-lane">
              <div class="person-lane-name"><span class="person-color-dot" style="background:${personColor(person)};"></span>${escapeHtml(person)}</div>
              <div class="person-lane-drop" data-person="${escapeHtml(person)}">${cards}</div>
            </div>
          `;
        }).join('')}
      </div>
    `).join('');

    teamsEl.querySelectorAll('.claim-release-btn').forEach(btn => {
      btn.addEventListener('click', () => releaseEvent(btn.dataset.key, btn.dataset.person));
    });

    teamsEl.querySelectorAll('.person-lane-drop').forEach(lane => {
      lane.addEventListener('dragover', (e) => {
        e.preventDefault();
        lane.classList.add('drag-over');
      });
      lane.addEventListener('dragleave', () => lane.classList.remove('drag-over'));
      lane.addEventListener('drop', (e) => {
        e.preventDefault();
        lane.classList.remove('drag-over');
        const key = e.dataTransfer.getData('text/plain');
        if (key) claimEvent(key, lane.dataset.person);
      });
    });
  }

  async function claimEvent(key, person) {
    const ev = allEvents.find(e => e.key === key);
    if (!ev || !person) return;

    ev.claimants = ev.claimants || [];
    if (ev.claimants.some(c => c.claimedBy === person)) return; // already claimed by this person — nothing to do

    // Optimistic update so the UI feels instant
    ev.claimants.push({ claimedBy: person, claimedAt: new Date().toISOString() });
    renderUpcoming(allEvents);
    renderCalendarGrid();
    renderInProcessBoard();

    try {
      await fetch(FEED_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
        body: JSON.stringify({
          action: 'claim', key: ev.key, client: ev.client, meetingType: ev.meetingType,
          title: ev.title, start: ev.start, name: person,
        }),
      });
    } catch (err) {
      console.error('Claim failed to save:', err);
    }
  }

  async function releaseEvent(key, person) {
    const ev = allEvents.find(e => e.key === key);
    if (!ev || !person) return;

    ev.claimants = (ev.claimants || []).filter(c => c.claimedBy !== person);
    renderUpcoming(allEvents);
    renderCalendarGrid();
    renderInProcessBoard();

    try {
      await fetch(FEED_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'release', key: key, name: person }),
      });
    } catch (err) {
      console.error('Release failed to save:', err);
    }
  }

  function closePopover() {
    const existing = document.querySelector('.day-popover');
    if (existing) existing.remove();
  }

  function showDayPopover(cellEl, dateObj, dayEvents) {
    closePopover();
    const pop = document.createElement('div');
    pop.className = 'day-popover';
    const dateLabel = dateObj.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    pop.innerHTML = `
      <span class="day-popover-close">✕</span>
      <div class="day-popover-title">${dateLabel}</div>
      ${dayEvents.sort((a, b) => new Date(a.start) - new Date(b.start)).map(ev => `
        <div class="day-popover-item">
          <div class="day-popover-time">${formatTime(ev.start, ev.allDay)}</div>
          <span class="client-tag" style="margin-top:4px;">${escapeHtml(ev.client)}</span>
          <span class="meeting-type-tag">${escapeHtml(ev.meetingType)}</span>
          ${amTagHtml(ev)}
          <div>${escapeHtml(ev.title)}</div>
        </div>
      `).join('')}
    `;
    document.body.appendChild(pop);

    const rect = cellEl.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + popRect.width > window.innerWidth - 12) left = window.innerWidth - popRect.width - 12;
    if (top + popRect.height > window.innerHeight - 12) top = rect.top - popRect.height - 6;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    pop.querySelector('.day-popover-close').addEventListener('click', closePopover);
  }

  function renderCalendarNavTitle() {
    document.getElementById('calendarNavTitle').textContent =
      viewMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  function renderCalendarGrid() {
    closePopover();
    renderCalendarNavTitle();

    const events = getFilteredEvents();
    const byDate = groupByDateKey(events);

    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay(); // 0=Sun
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const gridStart = new Date(year, month, 1 - startOffset);

    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const today = new Date();

    let html = WEEKDAY_LABELS.map(w => `<div class="weekday-header">${w}</div>`).join('');

    for (let i = 0; i < totalCells; i++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const isOutside = cellDate.getMonth() !== month;
      const isToday = cellDate.toDateString() === today.toDateString();
      const dayEvents = (byDate.get(cellDate.toDateString()) || []).sort((a, b) => new Date(a.start) - new Date(b.start));

      const visibleChips = dayEvents.slice(0, 3);
      const overflowCount = dayEvents.length - visibleChips.length;

      const chipsHtml = visibleChips.map(ev =>
        `<div class="day-chip" title="${escapeHtml(ev.client + ' — ' + ev.meetingType + ' — AM: ' + ev.am + ': ' + ev.title)}"><strong>${escapeHtml(ev.meetingType)}</strong> ${escapeHtml(ev.client)}</div>`
      ).join('') + (overflowCount > 0 ? `<div class="day-chip-more">+${overflowCount} more</div>` : '');

      html += `
        <div class="day-cell${isOutside ? ' outside-month' : ''}${isToday ? ' is-today' : ''}"
             data-date="${cellDate.toISOString()}"
             ${dayEvents.length ? 'data-has-events="1"' : ''}>
          <div class="day-number">${cellDate.getDate()}</div>
          ${chipsHtml}
        </div>
      `;
    }

    contentEl.innerHTML = `<div class="calendar-grid">${html}</div>`;

    contentEl.querySelectorAll('.day-cell[data-has-events]').forEach(cell => {
      cell.style.cursor = 'pointer';
      cell.addEventListener('click', () => {
        const dateObj = new Date(cell.dataset.date);
        const dayEvents = byDate.get(dateObj.toDateString()) || [];
        showDayPopover(cell, dateObj, dayEvents);
      });
    });
  }

  document.getElementById('prevMonthBtn').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderCalendarGrid();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderCalendarGrid();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderCalendarGrid();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.day-popover') && !e.target.closest('.day-cell')) closePopover();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function amTagHtml(ev, extraStyle) {
    const style = extraStyle ? ` style="${extraStyle}"` : '';
    if (ev.amEmail) {
      return `<a class="am-tag" href="mailto:${escapeHtml(ev.amEmail)}" title="Email ${escapeHtml(ev.am)}"${style}>${escapeHtml(ev.am)}</a>`;
    }
    return `<span class="am-tag"${style}>${escapeHtml(ev.am)}</span>`;
  }

  async function fetchEvents() {
    try {
      const res = await fetch(FEED_URL, { cache: 'no-store' });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      allEvents = data.events;
      renderFilterBar();
      renderAMFilterBar();
      renderCalendarGrid();
      renderUpcoming(allEvents);
      renderInProcessBoard();
      pulseDotEl.classList.remove('stale');
      const t = new Date(data.generatedAt);
      const errNote = (data.errors && data.errors.length) ? ` (${data.errors.length} calendar(s) failed)` : '';
      syncTextEl.textContent = 'Synced ' + t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + errNote;
      if (data.errors && data.errors.length) console.warn('Calendar sync issues:', data.errors);
    } catch (err) {
      pulseDotEl.classList.add('stale');
      syncTextEl.textContent = 'Sync failed';
      if (contentEl.querySelector('.empty-state')) {
        contentEl.innerHTML = `<div class="error-state">Couldn't load the calendar feed. Check the Web App URL and deployment access.</div>`;
      }
      console.error(err);
    }
  }

  fetchEvents();
  setInterval(fetchEvents, REFRESH_MS);
</script>
</body>
</html>
